name: Android-APK

# Bygger APK ved hver push (main og andre grener), ved pull requests og ved manuell start.
# APK-ene lastes opp som artefakter på kjøringen (Actions → kjøringen → Artifacts).
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Et nytt bygg på samme gren avbryter det forrige.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CARGO_NDK_VERSION: 4.1.2
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Release-nøkkel (valgfri). Se README.md for hvordan disse lages.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust med Android-mål
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK og NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo ndk --version 2>/dev/null || cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"

      - name: Tester (desktop)
        run: cargo test --locked --lib

      - name: Release-nøkkel fra Secrets
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bygg APK-er
        run: scripts/build-android.sh

      - name: Gi APK-ene lesbare navn
        run: |
          mkdir -p out
          v="0.1.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/CAD-viser-$v-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/CAD-viser-$v.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CAD-viser-debug-apk
          path: out/*-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        with:
          name: CAD-viser-release-apk
          path: out/CAD-viser-0.1.*[0-9].apk
          retention-days: 30

  # Røyktest på Android-emulator (x86_64): installerer debug-APK-en, åpner en DWG via
  # «Åpne med», prøver gester og rotasjon, og laster opp skjermbilder og logcat.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CAD-viser-debug-apk
          path: apk

      - name: Slå på KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ImageMagick (nedskalerte skjermbilder i loggen)
        run: sudo apt-get install -y --no-install-recommends imagemagick > /dev/null

      - name: Kjør røyktest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/emulator-smoke.sh "$(ls apk/*-debug.apk | head -1)" smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roeyktest-skjermbilder
          path: smoke/
          retention-days: 14
