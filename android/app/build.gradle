plugins {
    id 'com.android.application'
}

// Versjonsnummer: GitHub Actions setter VERSION_CODE til kjøringsnummeret, så hver APK kan
// installeres over den forrige.
def versionCodeEnv = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'io.github.oysteineliassen.cadviewer'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId 'io.github.oysteineliassen.cadviewer'
        minSdk 26
        targetSdk 35
        versionCode versionCodeEnv
        versionName "0.1.${versionCodeEnv}"
    }

    signingConfigs {
        // Fast debug-nøkkel i repoet (offentlig, passord «android»), så debug-APK-er fra
        // forskjellige bygg kan installeres over hverandre.
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Release-nøkkel fra miljøet (GitHub Secrets i workflowen), aldri i repoet.
        if (System.getenv("RELEASE_KEYSTORE")) {
            release {
                storeFile file(System.getenv("RELEASE_KEYSTORE"))
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (System.getenv("RELEASE_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Rust-biblioteket (libcadcraft_viewer.so) legges i src/main/jniLibs av
    // scripts/build-android.sh (cargo ndk) før Gradle kjøres.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
